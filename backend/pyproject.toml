[project]
name = "backend"
version = "0.1.0"
description = "Telecom Multisimmer API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.1",
    "uvicorn[standard]>=0.35.0",
    "pandas>=2.3.1",
    "numpy>=2.3.2",
    "scikit-learn>=1.7.1",
    "xgboost>=3.0.4",
    "pyarrow>=21.0.0",
    "joblib>=1.5.1",
    "category-encoders>=2.8.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]
