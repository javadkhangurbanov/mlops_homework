name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check .

  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Show docker versions
        run: |
          docker --version
          docker compose version || true

      # build both services to catch any Dockerfile or dependency issues
      - name: Compose build
        run: docker compose build

  deploy:
    name: Deploy on EC2 (self-hosted)
    runs-on: self-hosted
    needs: [lint, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Stop old stack (ignore if none)
        run: docker compose down || true

      - name: Build & start
        run: docker compose up -d --build

      - name: Verify containers
        run: |
          docker compose ps
          echo "Backend health:"
          curl -sS http://backend:8000/health || true
